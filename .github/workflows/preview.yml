name: Preview Deploy

on:
  push:
    branches-ignore: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit

  preview:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create Neon preview branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/${{ github.ref_name }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Run migrations on preview branch (direct connection)
        run: |
          DIRECT_URL=$(echo "$DATABASE_URL" | sed 's/-pooler\./\./')
          DATABASE_URL="$DIRECT_URL" npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: Seed preview database
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Set DATABASE_URL for preview deployment
        run: |
          NEON_URL="${{ steps.neon.outputs.db_url_with_pooler }}"

          # Write to .env at project root — Next.js reads this at build time
          echo "DATABASE_URL=${NEON_URL}" > .env.local

          # Also inject into Vercel's env file for the deployment
          ENV_FILE=".vercel/.env.preview.local"
          touch "$ENV_FILE"
          sed -i '/^DATABASE_URL=/d' "$ENV_FILE"
          echo "DATABASE_URL=${NEON_URL}" >> "$ENV_FILE"

          echo "✓ DATABASE_URL configured for preview"

      - name: Build preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: Deploy preview
        id: vercel
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✓ Deployed to: $URL"

      - name: Summary
        run: |
          echo "### Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel URL:** ${{ steps.vercel.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Neon Branch:** preview/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Host:** ${{ steps.neon.outputs.host }}" >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: Cleanup Neon Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'delete'
    steps:
      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/${{ github.ref_name }}
          api_key: ${{ secrets.NEON_API_KEY }}
