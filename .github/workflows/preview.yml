name: Preview Deploy

on:
  push:
    branches-ignore: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit

  preview:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create Neon preview branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/${{ github.ref_name }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Run migrations on preview branch
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: Seed preview database
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Inject Neon branch DATABASE_URL into Vercel env
        run: |
          # Override DATABASE_URL in the Vercel env file so it's available at both build and runtime
          ENV_FILE=".vercel/.env.preview.local"
          # Remove existing DATABASE_URL line if present
          sed -i '/^DATABASE_URL=/d' "$ENV_FILE" 2>/dev/null || true
          # Append the Neon branch URL
          echo 'DATABASE_URL="${{ steps.neon.outputs.db_url_with_pooler }}"' >> "$ENV_FILE"

      - name: Build preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: vercel
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel URL:** ${{ steps.vercel.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Neon Branch:** preview/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Host:** ${{ steps.neon.outputs.host }}" >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: Cleanup Neon Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'delete'
    steps:
      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/${{ github.ref_name }}
          api_key: ${{ secrets.NEON_API_KEY }}
