[package]
name = "copperhead"
version = "0.1.0"
edition = "2024"
description = "A Python subset that compiles to Rust"

[dependencies]
clap = { version = "4", features = ["derive"] }
rustpython-parser = "0.4"
miette = { version = "7", features = ["fancy"] }
ariadne = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
colored = "2"

[dev-dependencies]
insta = "1.39"
